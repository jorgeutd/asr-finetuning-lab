[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "asr-finetuning-lab"
version = "0.1.0"
description = "Reproducible Whisper fine-tuning: data, LoRA, evaluation, and Colab."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.13,<2", "soundfile>=0.13,<0.14",
  "PyYAML>=6,<7", "jiwer>=4,<5",
]

[project.optional-dependencies]
train = [
  "torch>=2.6,<2.10", "transformers==4.57.6", "peft>=0.17,<0.19",
  "accelerate>=1.10,<2", "datasets>=4,<5",
]
dev = ["pytest>=8,<10", "ruff>=0.12", "build>=1.2", "nbformat>=5.10"]

[project.urls]
Repository = "https://github.com/jorgeutd/asr-finetuning-lab"

[project.scripts]
asr-lab = "asr_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/asr_lab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: downloads a pretrained checkpoint; opt in with ASR_INTEGRATION=1"]
